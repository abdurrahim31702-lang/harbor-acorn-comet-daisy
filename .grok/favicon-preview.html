<html>
<head>

</head>
<body>
  <div class="row">
    <div class="cell"><img id="a" src="favicon.svg" width="16" height="16"/><span>16</span></div>
    <div class="cell"><img id="b" src="favicon.svg" width="32" height="32"/><span>32</span></div>
    <div class="cell"><img id="c" src="favicon.svg" width="64" height="64"/><span>64</span></div>
  </div>
</body>
</html>
